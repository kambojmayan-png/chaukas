name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # "npm install" on purpose: a lockfile written by npm on Windows omits a few Linux-only
      # optional packages, which makes the stricter "npm ci" refuse to run on this Linux runner.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
